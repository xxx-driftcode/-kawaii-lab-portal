name: Scrape KAWAII LAB. data

# 実行タイミング
on:
  schedule:
    # UTC基準の15分おき（日本時間とは9時間ずれるので注意）
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # 手動実行もできるようにしておく（Actionsタブから「Run workflow」で実行可能）

# リポジトリへの書き込み権限（output.json / youtube.json をコミットするために必要）
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Playwrightのブラウザをインストール
        run: playwright install --with-deps chromium

      - name: 公式サイトからINFO・SCHEDULEを取得
        run: python scraper.py

      - name: YouTube動画を取得
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_youtube.py

      - name: 変更をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.json youtube.json
          git diff --staged --quiet || git commit -m "自動更新: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
